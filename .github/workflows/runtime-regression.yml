name: Juriscribe runtime regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: juriscribe-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q juriscribe scripts tests
      - name: Unit, lifecycle and review-loop tests
        run: python -m unittest discover -s tests -v
      - name: Admission, manifest and onboarding integrity
        run: python scripts/check_contract.py

  simulation-and-saturation:
    runs-on: ubuntu-latest
    needs: runtime-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 400k five-class multi-seed simulations
        run: python scripts/simulate_v5_ci.py --cases 400000 --seeds 11,29,47,83,131,257,509,1021,2027,4093,8191,12289,16381,24593,32771,40961,49157,57347,65537,99991 --json-out validation/simulation-v5.json
      - name: M plus 1000 architecture saturation
        run: python scripts/reflect_v5.py --target 1000 --json-out validation/reflection-v5.json
      - name: Validation receipts are fixed-point
        run: git diff --exit-code -- validation/simulation-v5.json validation/reflection-v5.json
