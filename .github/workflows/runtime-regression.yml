name: Juriscribe runtime regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: juriscribe-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-main-provenance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Require main commit to be associated with a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['REPOSITORY']}/commits/{os.environ['SHA']}/pulls"
          request = urllib.request.Request(url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(request, timeout=20) as response:
              pulls = json.load(response)
          if not pulls:
              raise SystemExit("::error::main push is not associated with a pull request; configure server-side branch protection")
          print(f"main commit associated with PR(s): {[p['number'] for p in pulls]}")
          PY

  runtime-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            if ! python -m py_compile "$file"; then
              echo "::error file=$file::Python compile failed for $file"
              exit 1
            fi
          done < <(find juriscribe scripts tests -type f -name '*.py' -print0 | sort -z)
      - name: Unit, lifecycle, review, continuation, multimode and finalization tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > /tmp/juriscribe-unittest.log 2>&1
          status=$?
          cat /tmp/juriscribe-unittest.log
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          text = Path('/tmp/juriscribe-unittest.log').read_text(encoding='utf-8', errors='replace')
          tail = text[-3500:]
          tail = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Juriscribe unittest failure::{tail}')
          PY
            exit "$status"
          fi
      - name: Admission, modes, editorial standard, manifest and onboarding integrity
        shell: bash
        run: |
          set +e
          python scripts/check_contract.py > /tmp/juriscribe-contract.log 2>&1
          status=$?
          cat /tmp/juriscribe-contract.log
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          text = Path('/tmp/juriscribe-contract.log').read_text(encoding='utf-8', errors='replace')[-3500:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Juriscribe contract check failure::{text}')
          PY
            exit "$status"
          fi
      - name: Evidence traceability and dashboard coverage contract
        shell: bash
        run: python scripts/check_evidence_traceability_contract.py
      - name: Generation configuration anti-plagiarism saturation and artifact-atlas contract
        shell: bash
        run: python scripts/check_generation_governance_contract.py
      - name: Persistent dashboard contract and real tri-mode E2E
        shell: bash
        run: |
          python scripts/check_persistent_dashboard_contract.py
          python scripts/exercise_persistent_dashboard_v98.py

  simulation-and-saturation:
    runs-on: ubuntu-latest
    needs: runtime-tests
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Materialize real persistent dashboard E2E artifacts
        run: python scripts/exercise_persistent_dashboard_v98.py --out-root /tmp/persistent-dashboard-e2e --json-out /tmp/persistent-dashboard-e2e.json
      - name: Retain persistent dashboard E2E artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: persistent-dashboard-e2e
          path: |
            /tmp/persistent-dashboard-e2e/**/artifacts/session-dashboard.html
            /tmp/persistent-dashboard-e2e/**/ledger/dashboard-generations.jsonl
            /tmp/persistent-dashboard-e2e.json
          if-no-files-found: error
          retention-days: 7
      - name: 400k five-class multi-seed simulations
        run: python scripts/simulate_v5_ci.py --cases 400000 --seeds 11,29,47,83,131,257,509,1021,2027,4093,8191,12289,16381,24593,32771,40961,49157,57347,65537,99991 --json-out /tmp/simulation-v5.json
      - name: M plus 1000 architecture saturation
        run: python scripts/reflect_v5.py --target 1000 --json-out /tmp/reflection-v5.json
      - name: 10k continuation coverage scenarios
        run: python scripts/simulate_continuation_v6.py --json-out /tmp/continuation-v6.json
      - name: 10k bootstrap provenance finalization mutations
        run: python scripts/simulate_v7.py --cases 10000 --json-out /tmp/mutation-v7.json
      - name: Historiography integrity 1..M plus 100 no-novelty
        run: python scripts/reflect_v8.py --target 100 --json-out /tmp/reflection-v8.json
      - name: 30k tri-mode and editorial contract scenarios
        run: python scripts/simulate_modes_v9.py --cases 30000 --json-out /tmp/modes-v9.json
      - name: 10k unique dashboard evidence coverage scenarios
        shell: bash
        run: |
          set +e
          python scripts/simulate_dashboard_evidence_v96.py --cases 10000 --seeds 17,31,53,79,113,157,211,269,337,401,463,541,617,701,809,919,1031,1151,1297,1429 --json-out /tmp/dashboard-evidence-v96.json > /tmp/dashboard-evidence-v96.log 2>&1
          status=$?
          cat /tmp/dashboard-evidence-v96.log
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          text = Path('/tmp/dashboard-evidence-v96.log').read_text(encoding='utf-8', errors='replace')[-3500:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Dashboard evidence 10k failure::{text}')
          PY
            exit "$status"
          fi
      - name: 10k unique generation governance edge scenarios
        shell: bash
        run: |
          set +e
          python scripts/simulate_generation_governance_v97.py --cases 10000 --seeds 19,37,61,89,127,173,229,281,347,419,487,563,641,733,827,929,1039,1171,1321,1481 --json-out /tmp/generation-governance-v97.json > /tmp/generation-governance-v97.log 2>&1
          status=$?
          cat /tmp/generation-governance-v97.log
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          text = Path('/tmp/generation-governance-v97.log').read_text(encoding='utf-8', errors='replace')[-3500:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Generation governance 10k failure::{text}')
          PY
            exit "$status"
          fi
      - name: Simulation receipt is semantic fixed-point
        run: python scripts/check_validation_receipts.py validation/simulation-v5.json /tmp/simulation-v5.json
      - name: Reflection receipt is semantic fixed-point
        run: python scripts/check_validation_receipts.py validation/reflection-v5.json /tmp/reflection-v5.json
      - name: Continuation receipt is semantic fixed-point
        run: python scripts/check_validation_receipts.py validation/continuation-v6.json /tmp/continuation-v6.json
      - name: V7 mutation receipt is semantic fixed-point
        run: python scripts/check_validation_receipts.py validation/mutation-v7.json /tmp/mutation-v7.json
      - name: V8 historiography reflection receipt is semantic fixed-point
        run: python scripts/check_validation_receipts.py validation/reflection-v8.json /tmp/reflection-v8.json
      - name: V9 tri-mode receipt is semantic fixed-point
        run: python scripts/check_validation_receipts.py validation/modes-v9.json /tmp/modes-v9.json
