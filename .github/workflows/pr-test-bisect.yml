name: Juriscribe PR semantic test bisect

on:
  pull_request:

permissions:
  contents: read

jobs:
  bisect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: New C&C human-like journey
        continue-on-error: true
        run: python -m unittest discover -s tests -p 'test_compression_consolidation_v11.py' -v
      - name: New v0.11 contract binding
        continue-on-error: true
        run: python -m unittest discover -s tests -p 'test_mode_contract_v11.py' -v
      - name: New memory host bootstrap
        continue-on-error: true
        run: python -m unittest discover -s tests -p 'test_portable_session_v11.py' -v
      - name: Legacy bootstrap and mode contracts
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p 'test_runtime_v7.py' -v
          python -m unittest discover -s tests -p 'test_modes_v9.py' -v
      - name: Legacy continuation and delivery
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p 'test_continuation_v6.py' -v
          python -m unittest discover -s tests -p 'test_delivery_v9_1.py' -v
          python -m unittest discover -s tests -p 'test_delivery_boundary_layering_v10_0.py' -v
      - name: Legacy semantic artifacts and universal delivery
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p 'test_editorial_artifacts_v9_4.py' -v
          python -m unittest discover -s tests -p 'test_chat_tail_docx_delivery_v10_0.py' -v
          python -m unittest discover -s tests -p 'test_universal_artifact_autopilot_v10_0.py' -v
