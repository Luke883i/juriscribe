name: Juriscribe PR semantic test bisect

on:
  pull_request:

permissions:
  contents: read

jobs:
  bisect:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - {name: cc-human-journey, pattern: test_compression_consolidation_v11.py}
          - {name: v011-contract-binding, pattern: test_mode_contract_v11.py}
          - {name: portable-session, pattern: test_portable_session_v11.py}
          - {name: legacy-runtime-v7, pattern: test_runtime_v7.py}
          - {name: legacy-modes-v9, pattern: test_modes_v9.py}
          - {name: legacy-continuation-v6, pattern: test_continuation_v6.py}
          - {name: legacy-delivery-v91, pattern: test_delivery_v9_1.py}
          - {name: delivery-boundary-v100, pattern: test_delivery_boundary_layering_v10_0.py}
          - {name: editorial-artifacts-v94, pattern: test_editorial_artifacts_v9_4.py}
          - {name: chat-tail-docx-v100, pattern: test_chat_tail_docx_delivery_v10_0.py}
          - {name: universal-autopilot-v100, pattern: test_universal_artifact_autopilot_v10_0.py}
          - {name: public-surface-v92, pattern: test_surface_v9_2.py}
          - {name: legacy-contract-compat-v011, pattern: test_legacy_contract_compat_v11.py}
    name: ${{ matrix.suite.name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p '${{ matrix.suite.pattern }}' -v
