name: Juriscribe runtime convergence v0.13

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: juriscribe-runtime-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convergence-10m:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Compile convergence surface
        run: python -m py_compile juriscribe/modes.py juriscribe/mode_runtime.py juriscribe/runtime_router.py juriscribe/runtime_v13.py juriscribe/orchestrator.py juriscribe/interaction.py juriscribe/chat_shell.py juriscribe/pipeline_v11.py scripts/check_runtime_convergence_v13.py scripts/simulate_runtime_convergence_v13.py tests/test_runtime_convergence_v13.py
      - name: Current topology contract
        run: python scripts/check_runtime_convergence_v13.py
      - name: Focused convergence tests
        run: python -m unittest tests.test_runtime_convergence_v13 tests.test_mode_runtime_v13 tests.test_runtime_semantics_v12 -v
      - name: Ten-million cross-layer mutation validators
        run: python scripts/simulate_runtime_convergence_v13.py --cases 10000000 --seed 1363003010493296010 --json-out /tmp/runtime-convergence-v13.json
      - name: Verify deterministic stress evidence
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/runtime-convergence-v13.json',encoding='utf-8'))
          assert p['status']=='PASS'
          assert p['actual_validator_invocations']==10_000_000
          assert p['deep_signature_checks']==64 and not p['deep_signature_failures']
          assert p['failures']==0
          assert p['saturation']['M']==64 and p['saturation']['m_plus_1000_no_novelty']
          assert p['saturation']['N']==21 and p['saturation']['n_plus_1000_no_better_compression']
          assert p['scenario_digest']=='de894953f9b24fe4d72671eb72bd22a1b04372fa4bf2dab3bd1f4e32bd1063f1'
          PY
      - name: Retain convergence receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-convergence-v13
          path: /tmp/runtime-convergence-v13.json
          if-no-files-found: error
          retention-days: 7
