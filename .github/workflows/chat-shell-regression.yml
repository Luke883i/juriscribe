name: Juriscribe chat shell regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: juriscribe-chat-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  projection-soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Compile chat shell surface
        run: python -m py_compile juriscribe/chat_shell.py juriscribe/interaction.py scripts/simulate_chat_shell_v1.py tests/test_chat_shell_v1.py
      - name: Focused chat shell tests
        run: python -m unittest tests.test_chat_shell_v1 -v
      - name: 1000 journeys plus one-million projection edge cases
        run: python scripts/simulate_chat_shell_v1.py --journeys 1000 --cases 1000000 --json-out /tmp/chat-shell-v1.json
      - name: Retain projection soak receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chat-shell-v1
          path: /tmp/chat-shell-v1.json
          if-no-files-found: error
          retention-days: 7
