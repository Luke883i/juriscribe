[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "juriscribe-runtime"
version = "0.12.0"
description = "Repository-governed runtime for auditable legal, scientific and editorial work"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
juriscribe = "juriscribe.pipeline:main"

[tool.setuptools.packages.find]
include = ["juriscribe*"]

[tool.setuptools.package-data]
"juriscribe.resources" = ["ISENECA_ACCESS_CONTRACT.md"]
