[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "juriscribe-runtime"
version = "1.0.0"
description = "Experimental open-source repository-governed runtime for auditable legal, scientific and editorial work"
requires-python = ">=3.10"
dependencies = []
license = {file = "LICENSE"}

[project.urls]
Repository = "https://github.com/Luke883i/juriscribe"

[project.scripts]
juriscribe = "juriscribe.pipeline:main"

[tool.setuptools.packages.find]
include = ["juriscribe*"]

[tool.setuptools.package-data]
"juriscribe.resources" = ["ISENECA_ACCESS_CONTRACT.md"]
